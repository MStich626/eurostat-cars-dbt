name: dbt Daily Pipeline Execution

on:
  schedule:
    - cron: '0 6 * * *'  # Uruchamianie codziennie o 6:00 UTC
  workflow_dispatch:      # Umożliwia ręczne odpalenie przyciskiem "Run workflow"
  push:
    branches:
      - main              # Odpala się automatycznie po każdym pushu do main

jobs:
  run_dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up GCP Credentials and Run dbt
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_KEY }}
        run: |
          python -c "import base64, os; open('sa_key.json', 'wb').write(base64.b64decode(os.environ['GCP_SA_KEY_BASE64']))"
          dbt run --profiles-dir .
          dbt test --profiles-dir .
          rm sa_key.json