name: dbt Daily Pipeline Execution (Docker)

on:
  repository_dispatch:
    types: [run-dbt-schedule]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run_dbt_docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Service Account Key File
        run: |
          echo '${{ secrets.GCP_KEY }}' > sa_key.json

      - name: Build Docker image
        run: docker build -t mojdbtapp .

      - name: Run dbt inside Docker container
        run: |
          docker run --rm mojdbtapp