version: 2

models:
  - name: mart_eurostat_cars
    description: "Końcowa tabela analityczna łącząca motoryzację z demografią."
    columns:
      - name: country_code
        data_tests:
          - not_null
      - name: year
        data_tests:
          - not_null
      - name: cars_per_1000_capita
        description: "Liczba aut na 1000 mieszkańców."
        data_tests:
          - not_null